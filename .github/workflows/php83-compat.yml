name: PHP compatibility

on:
  push:
    branches: [codex/php83-compat]
    tags: ['v5.12.2-patch.*', '5.12.2-patch.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          extensions: dom,fileinfo,mbstring,xmlreader,zip,zlib
          coverage: none
          ini-values: zend.assertions=1,error_reporting=-1
          tools: composer:v2
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer validate --strict
      - run: composer check-platform-reqs
      - name: Syntax
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Upstream tests and parser-error regression
        run: vendor/bin/phpunit --no-coverage --no-logging
      - name: Streaming text round trip
        run: php -d memory_limit=64M tests/Compatibility/streaming.php
